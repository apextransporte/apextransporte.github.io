name: Update stats

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: update-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Tesseract
        run: |
          sudo apt-get install -y --no-install-recommends tesseract-ocr || (sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr)

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run update_stats.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_STATS_CHANNEL_ID: ${{ secrets.DISCORD_STATS_CHANNEL_ID }}
          DISCORD_OUTPUT_CHANNEL_ID: ${{ secrets.DISCORD_OUTPUT_CHANNEL_ID }}
          UNB_TOKEN: ${{ secrets.UNB_TOKEN }}
          UNB_GUILD_ID: ${{ secrets.UNB_GUILD_ID }}
          ECONOMY_CHANNEL_ID: ${{ secrets.ECONOMY_CHANNEL_ID }}
        run: python update_stats.py

      - name: Build staff.json
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_STATS_CHANNEL_ID: ${{ secrets.DISCORD_STATS_CHANNEL_ID }}
        run: python build_staff.py

      - name: Save results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data.json jobs.json posted.json failed_images.json diag.json net_worth.json members.json staff.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to save"
          else
            git commit -m "Update stats"
            for i in 1 2 3; do
              git pull --rebase -X theirs && git push && break
              sleep 5
            done
          fi
