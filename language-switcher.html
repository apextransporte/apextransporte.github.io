<!-- STEP 1: Paste this inside your top menu, right before the Apply link -->
<div class="lang-switch notranslate" translate="no">
  <button type="button" class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
    <span aria-hidden="true">🌐</span> <span id="langCode">EN</span>
  </button>
  <ul class="lang-menu" id="langMenu" role="listbox" hidden></ul>
</div>
<div id="google_translate_element" style="display:none"></div>

<!-- STEP 2: Paste this inside your CSS file or a style tag -->
<style>
.lang-switch { position: relative; display: inline-block; }
.lang-btn {
  background: transparent; color: inherit; font: inherit; cursor: pointer;
  border: 1px solid rgba(255,255,255,.25); border-radius: 6px; padding: 6px 10px;
}
.lang-btn:hover, .lang-btn:focus-visible { border-color: #e10600; outline: none; }
.lang-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 1000;
  margin: 0; padding: 6px; list-style: none; min-width: 190px;
  max-height: 320px; overflow-y: auto;
  background: #111; border: 1px solid #e10600; border-radius: 8px;
}
.lang-menu[hidden] { display: none; }
.lang-menu li { padding: 8px 10px; cursor: pointer; border-radius: 4px; color: #fff; }
.lang-menu li:hover, .lang-menu li:focus-visible, .lang-menu li[aria-selected="true"] {
  background: #e10600; outline: none;
}
/* Hide the Google Translate banner */
.goog-te-banner-frame, .skiptranslate iframe, #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
body { top: 0 !important; }
</style>

<!-- STEP 3: Paste this just above the closing body tag -->
<script>
(function () {
  var LANGS = [
    ["tr","Türkçe"],["en","English"],["ar","العربية"],["sw","Kiswahili"],["lg","Luganda"],
    ["de","Deutsch"],["fr","Français"],["es","Español"],["pt","Português"],["it","Italiano"],
    ["nl","Nederlands"],["pl","Polski"],["ro","Română"],["ru","Русский"],["uk","Українська"],
    ["bg","Български"],["el","Ελληνικά"],["hu","Magyar"],["cs","Čeština"],["sv","Svenska"],
    ["az","Azərbaycanca"],["fa","فارسی"],["ur","اردو"],["hi","हिन्दी"],["bn","বাংলা"],
    ["id","Bahasa Indonesia"],["ms","Bahasa Melayu"],["th","ไทย"],["vi","Tiếng Việt"],
    ["zh-CN","中文"],["ja","日本語"],["ko","한국어"]
  ];
  var btn = document.getElementById("langBtn");
  var menu = document.getElementById("langMenu");
  var codeEl = document.getElementById("langCode");

  function current() {
    try { return localStorage.getItem("lang") || "en"; } catch (e) { return "en"; }
  }
  function save(code) {
    try { localStorage.setItem("lang", code); } catch (e) {}
  }
  function setCookie(code) {
    var host = location.hostname;
    if (code === "en") {
      document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/";
      document.cookie = "googtrans=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;domain=" + host;
    } else {
      document.cookie = "googtrans=/en/" + code + ";path=/";
      document.cookie = "googtrans=/en/" + code + ";path=/;domain=" + host;
    }
  }
  function choose(code) {
    save(code);
    setCookie(code);
    location.reload();
  }
  function toggle(open) {
    menu.hidden = !open;
    btn.setAttribute("aria-expanded", open ? "true" : "false");
  }

  var now = current();
  codeEl.textContent = now.split("-")[0].toUpperCase();

  LANGS.forEach(function (l) {
    var li = document.createElement("li");
    li.textContent = l[1];
    li.setAttribute("role", "option");
    li.setAttribute("tabindex", "0");
    li.setAttribute("lang", l[0]);
    if (l[0] === now) li.setAttribute("aria-selected", "true");
    li.addEventListener("click", function () { choose(l[0]); });
    li.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); choose(l[0]); }
    });
    menu.appendChild(li);
  });

  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    toggle(menu.hidden);
  });
  document.addEventListener("click", function () { toggle(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") toggle(false); });

  // Keep the saved language after a reload
  if (now !== "en") setCookie(now);

  window.googleTranslateElementInit = function () {
    new google.translate.TranslateElement({ pageLanguage: "en", autoDisplay: false }, "google_translate_element");
  };
  var s = document.createElement("script");
  s.src = "https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit";
  s.async = true;
  document.body.appendChild(s);
})();
</script>
